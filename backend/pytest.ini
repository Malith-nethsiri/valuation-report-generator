[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
env =
    DATABASE_URL=postgresql://testuser:testpass@localhost:5432/testdb
    SECRET_KEY=test-secret-key-for-testing-only
    ENV=testing
