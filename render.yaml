services:
  - type: web
    name: property-valuation-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GOOGLE_VISION_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ENV
        value: production
    plan: free
    healthCheckPath: /api/health
